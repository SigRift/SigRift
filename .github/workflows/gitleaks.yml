name: Gitleaks

# Secret scan using the gitleaks CLI directly. We deliberately skip
# the `gitleaks/gitleaks-action` wrapper because that action requires
# a paid GITLEAKS_LICENSE for organization-owned repos (even public
# ones post-2025). The gitleaks CLI itself is MIT-licensed and free.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    name: Secret scan (gitleaks CLI)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        # Download, check the pinned sha256 (from the release's
        # gitleaks_<version>_checksums.txt), only then unpack. Bump the
        # version and the hash together.
        env:
          GITLEAKS_VERSION: 8.21.2
          GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "${RUNNER_TEMP}/${tarball}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${tarball}" | sha256sum --check --strict -
          tar xzf "${RUNNER_TEMP}/${tarball}" -C /usr/local/bin gitleaks
          gitleaks version

      - name: Run gitleaks
        run: |
          # --no-git --log-opts uses git history for PRs, working tree
          # for push. --verbose gives per-finding context. --redact
          # prevents secrets appearing in CI logs.
          gitleaks detect \
            --source . \
            --verbose \
            --redact \
            --exit-code 1 \
            --report-format sarif \
            --report-path gitleaks.sarif

      - name: Upload SARIF to GitHub code-scanning
        # GitHub Advanced Security (code-scanning uploads) is not
        # available on Free-plan private repos. The scan itself still
        # runs and fails the job on leaks; the upload is best-effort.
        # When the repo flips public, uploads succeed and findings
        # appear in the Security tab.
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks
