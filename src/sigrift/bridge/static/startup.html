<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Bridge — Starting Up</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0f172a;
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  .container {
    text-align: center;
    max-width: 520px;
    padding: 40px;
  }
  .logo {
    display: inline-block;
    background: linear-gradient(135deg, #3b82f6, #8b5cf6);
    color: #fff;
    font-weight: 900;
    font-size: 1.4em;
    padding: 8px 16px;
    border-radius: 8px;
    margin-bottom: 24px;
    letter-spacing: 2px;
  }
  h1 {
    font-size: 1.6em;
    font-weight: 600;
    margin-bottom: 8px;
  }
  .subtitle {
    color: #94a3b8;
    font-size: 0.95em;
    margin-bottom: 32px;
  }
  .progress-container {
    background: #1e293b;
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 20px;
    border: 1px solid #334155;
  }
  .status-label {
    font-size: 0.85em;
    color: #94a3b8;
    margin-bottom: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .progress-bar-bg {
    background: #1e293b;
    border-radius: 8px;
    height: 12px;
    overflow: hidden;
    border: 1px solid #334155;
    margin-bottom: 12px;
  }
  .progress-bar-fill {
    height: 100%;
    border-radius: 8px;
    background: linear-gradient(90deg, #3b82f6, #8b5cf6);
    transition: width 1s ease;
    width: 0%;
  }
  .progress-bar-fill.indeterminate {
    width: 100%;
    background: linear-gradient(90deg, #1e293b, #3b82f6, #8b5cf6, #1e293b);
    background-size: 200% 100%;
    animation: shimmer 2s infinite linear;
  }
  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }
  .stats {
    display: flex;
    justify-content: space-around;
    gap: 16px;
    margin-top: 16px;
  }
  .stat {
    text-align: center;
  }
  .stat-value {
    font-size: 1.3em;
    font-weight: 700;
    color: #f1f5f9;
  }
  .stat-label {
    font-size: 0.75em;
    color: #64748b;
    margin-top: 2px;
  }
  .state-badge {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 6px;
    font-size: 0.85em;
    font-weight: 600;
    margin-bottom: 16px;
  }
  .state-running { background: #1e3a5f; color: #60a5fa; }
  .state-passed { background: #14532d; color: #4ade80; }
  .state-failed { background: #7f1d1d; color: #fca5a5; }
  .state-skipped { background: #3f3f46; color: #a1a1aa; }
  .state-pending { background: #1e293b; color: #94a3b8; }
  .message {
    color: #94a3b8;
    font-size: 0.9em;
    margin-top: 16px;
  }
  .redirect-msg {
    color: #64748b;
    font-size: 0.8em;
    margin-top: 20px;
  }
  .spinner {
    display: inline-block;
    width: 16px;
    height: 16px;
    border: 2px solid #334155;
    border-top-color: #3b82f6;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="container">
  <div class="logo">RF</div>
  <h1>The Bridge</h1>
  <p class="subtitle">System startup in progress</p>

  <div class="progress-container">
    <div class="status-label">Database Integrity Check</div>
    <div id="state-badge" class="state-badge state-pending">Connecting...</div>
    <div class="progress-bar-bg">
      <div id="progress-fill" class="progress-bar-fill indeterminate"></div>
    </div>
    <div class="stats">
      <div class="stat">
        <div class="stat-value" id="db-size">--</div>
        <div class="stat-label">Database (MB)</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="elapsed">--</div>
        <div class="stat-label">Elapsed (s)</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="est-remaining">--</div>
        <div class="stat-label">Est. Remaining</div>
      </div>
    </div>
    <p class="message" id="message"><span class="spinner"></span> Waiting for status...</p>
  </div>

  <p class="redirect-msg" id="redirect-msg"></p>
</div>

<script src="/static/startup.js?v=1"></script>
</body>
</html>
