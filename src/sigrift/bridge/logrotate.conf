# /etc/logrotate.d/sigrift-bridge
# Log rotation for the SigRift bridge
#
# Install:
#   sudo cp logrotate.conf /etc/logrotate.d/sigrift-bridge
#   sudo mkdir -p /var/log/sigrift
#   sudo chown sigrift:sigrift /var/log/sigrift
#   sudo chmod 750 /var/log/sigrift

/var/log/sigrift/bridge.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    maxsize 100M
    create 640 sigrift sigrift
    copytruncate
    dateext
    dateformat -%Y%m%d

    postrotate
        # Signal the application to reopen log handles if needed.
        # copytruncate avoids the need for a full restart, but SIGUSR1
        # lets the app flush buffers and note the rotation in its logs.
        if [ -f /run/sigrift-bridge.pid ]; then
            kill -USR1 "$(cat /run/sigrift-bridge.pid)" 2>/dev/null || true
        fi
    endscript
}
