<!DOCTYPE html>
<html lang="en" data-theme="dark">
<script src="/static/login_theme.js?v=1"></script>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — The Bridge</title>
    <style>
        :root {
            --bg: #0f1117;
            --card-bg: #1a1d27;
            --border: #2a2d3a;
            --text: #e2e4ea;
            --text-secondary: #8b8fa3;
            --accent: #4f8cff;
            --accent-hover: #6ba0ff;
            --danger: #ff5c5c;
            --input-bg: #12141c;
            --radius: 8px;
        }
        [data-theme="light"] {
            --bg: #f0f2f5;
            --card-bg: #ffffff;
            --border: #d1d5db;
            --text: #1a1d27;
            --text-secondary: #6b7280;
            --accent: #3b72e0;
            --accent-hover: #2b62d0;
            --danger: #dc3545;
            --input-bg: #f9fafb;
        }
        [data-theme="matrix"] {
            --bg: #000000;
            --card-bg: #0a0a0a;
            --border: #0a3a0a;
            --text: #00ff41;
            --text-secondary: #00cc33;
            --accent: #00ff41;
            --accent-hover: #33ff77;
            --danger: #ff3355;
            --input-bg: #050505;
            --radius: 0px;
        }
        [data-theme="matrix"] body {
            text-shadow: 0 0 4px rgba(0,255,65,0.3);
        }
        [data-theme="matrix"] .login-card {
            box-shadow: 0 0 20px rgba(0,255,65,0.1), inset 0 0 60px rgba(0,255,65,0.02);
        }
        [data-theme="matrix"] .login-logo {
            background: #003300;
            color: #00ff41;
            text-shadow: 0 0 8px rgba(0,255,65,0.6);
        }
        [data-theme="matrix"] .btn-login {
            background: #003300;
            color: #00ff41;
            border: 1px solid #00ff41;
            text-shadow: 0 0 6px rgba(0,255,65,0.4);
        }
        [data-theme="matrix"] .btn-login:hover {
            background: #004400;
            box-shadow: 0 0 12px rgba(0,255,65,0.3);
        }
        [data-theme="matrix"] .form-input:focus {
            border-color: #00ff41;
            box-shadow: 0 0 6px rgba(0,255,65,0.25);
        }
        [data-theme="matrix"] .login-tab.active {
            border-bottom-color: #00ff41;
            text-shadow: 0 0 8px rgba(0,255,65,0.5);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 40px 36px 32px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.3);
        }
        .login-brand {
            text-align: center;
            margin-bottom: 28px;
        }
        .login-logo {
            display: inline-block;
            background: var(--accent);
            color: #fff;
            font-weight: 800;
            font-size: 1.1em;
            padding: 4px 10px;
            border-radius: 4px;
            margin-right: 6px;
            letter-spacing: 1px;
        }
        .login-title {
            font-size: 1.4em;
            font-weight: 600;
        }
        .login-tabs {
            display: flex;
            border-bottom: 2px solid var(--border);
            margin-bottom: 20px;
        }
        .login-tab {
            flex: 1;
            padding: 8px 0;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 0.95em;
            color: var(--text-secondary);
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            transition: color 0.15s, border-color 0.15s;
        }
        .login-tab.active {
            color: var(--text);
            font-weight: 600;
            border-bottom-color: var(--accent);
        }
        .login-panel { display: none; }
        .login-panel.active { display: block; }
        .form-label {
            display: block;
            font-size: 0.85em;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }
        .form-input {
            width: 100%;
            padding: 10px 12px;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            font-size: 0.95em;
            margin-bottom: 12px;
            outline: none;
            transition: border-color 0.15s;
        }
        .form-input:focus {
            border-color: var(--accent);
        }
        .btn-login {
            width: 100%;
            padding: 10px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: var(--radius);
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
        }
        .btn-login:hover { background: var(--accent-hover); }
        .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }
        .login-error {
            display: none;
            color: var(--danger);
            font-size: 0.9em;
            margin-bottom: 12px;
            padding: 8px 10px;
            background: rgba(255,92,92,0.08);
            border-radius: var(--radius);
        }
        .mfa-section {
            display: none;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }
        .mfa-section .form-label { margin-bottom: 6px; }
        .caps-lock-warning {
            display: none;
            font-size: 0.8em;
            color: var(--text-secondary);
            margin: -8px 0 12px;
            padding: 4px 8px;
            background: rgba(139,143,163,0.08);
            border-left: 2px solid var(--accent);
            border-radius: 2px;
        }
        .caps-lock-warning.visible { display: block; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-brand">
            <span class="login-logo">RF</span>
            <span class="login-title">The Bridge</span>
        </div>

        <div class="login-tabs">
            <button class="login-tab active" data-tab="login" id="tab-login">Login</button>
            <button class="login-tab" data-tab="apikey" id="tab-apikey">API Key</button>
        </div>

        <div id="login-error" class="login-error"></div>

        <div id="panel-login" class="login-panel active">
            <label class="form-label" for="username">Username</label>
            <input type="text" id="username" class="form-input" placeholder="Username" autocomplete="username">
            <label class="form-label" for="password">Password</label>
            <input type="password" id="password" class="form-input" placeholder="Password" autocomplete="current-password">
            <div id="caps-lock-warning" class="caps-lock-warning" role="status" aria-live="polite">Caps Lock is on</div>

            <div id="mfa-section" class="mfa-section">
                <label class="form-label" for="mfa-code">MFA or backup code</label>
                <input type="text" id="mfa-code" class="form-input" placeholder="6-digit code or backup code" autocomplete="one-time-code" maxlength="8">
                <button class="btn-login" id="mfa-submit">Verify</button>
            </div>
        </div>

        <div id="panel-apikey" class="login-panel">
            <label class="form-label" for="apikey">API Key</label>
            <input type="password" id="apikey" class="form-input" placeholder="Enter your API key" autocomplete="off">
        </div>

        <button class="btn-login" id="login-submit">Sign In</button>
    </div>

    <script src="/static/login.js?v=105"></script>
</body>
</html>
