[package]
name = "sigrift-gateway"
version = "0.1.0"
edition = "2021"
description = "SigRift community gateway binary. Wraps sigrift-gateway-core with NullLicenseResolver."
license = "MIT"
rust-version = "1.80"

[[bin]]
name = "sigrift-gateway"
path = "src/main.rs"

[dependencies]
sigrift-gateway-core = { path = "../sigrift-gateway-core", version = "0.1.0" }
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
rustls = { version = "0.23", features = ["ring"] }
