<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 548" width="960" height="548" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
<title id="t">SigRift with several Raspberry Pi nodes and one central server</title><desc id="d">Three Raspberry Pi nodes with different radios each run scanners and an edge agent. Every node sends detections and heartbeats over HTTPS, with its own API key, to the gateway on a central server, on-premises or in the cloud. The bridge on that server correlates all nodes and serves one dashboard to operators' browsers.</desc>
