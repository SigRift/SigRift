<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 452" width="960" height="452" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
<title id="t">SigRift on a single Raspberry Pi</title><desc id="d">Radios attached to one Raspberry Pi feed scanner containers. The scanners and the edge agent send detections and heartbeats to the Rust gateway, which authenticates them and passes them to the Python bridge on a private network. A browser reaches the dashboard through the gateway over HTTPS.</desc>
