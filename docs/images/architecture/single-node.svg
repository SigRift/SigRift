<text x="94.0" y="313.0" font-size="12" font-weight="400" text-anchor="middle" fill="#9198a1">optional</text>
<rect x="192" y="68" width="564" height="364" rx="12" fill="none" stroke="#6e7681" stroke-width="1.5" stroke-dasharray="6 5"/>
