<text x="24" y="50" font-size="13" font-weight="400" text-anchor="start" fill="#9198a1">One Raspberry Pi runs the scanners, the gateway and the bridge.</text>
<text x="94" y="96" font-size="13" font-weight="600" text-anchor="middle" fill="#9198a1">Radios</text>
