<text x="356" y="650" font-size="13" text-anchor="middle" fill="#9198a1" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">scanner + agent</text>
<text x="68" y="698" font-size="14" fill="#9198a1">BLE beacons such as ALPR cameras</text>

<!-- Links to the server -->
<text x="534" y="196" font-size="13" text-anchor="middle" fill="#9198a1">HTTPS, one</text>
<text x="534" y="214" font-size="13" text-anchor="middle" fill="#9198a1">API key per node</text>
<line x1="470" y1="235" x2="596" y2="350" stroke="#9198a1" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="470" y1="435" x2="596" y2="450" stroke="#9198a1" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="470" y1="635" x2="596" y2="550" stroke="#9198a1" stroke-width="1.6" marker-end="url(#a)"/>

<!-- Central server -->
