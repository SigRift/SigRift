<text x="620" y="298" font-size="20" font-weight="700" fill="#e6edf3">Central server</text>
<text x="620" y="320" font-size="14" fill="#9198a1">on-prem or in the cloud</text>
<rect x="620" y="340" width="300" height="108" rx="10" fill="#0c2d4d" stroke="#58a6ff" stroke-width="1.5"/>
<text x="640" y="374" font-size="18" font-weight="700" fill="#e6edf3">Gateway</text>
<text x="640" y="400" font-size="14" fill="#c9d1d9">TLS and per-node API keys</text>
<text x="640" y="424" font-size="14" fill="#c9d1d9">sign-in and rate limits</text>
<rect x="620" y="466" width="300" height="154" rx="10" fill="#0f2d27" stroke="#3fb9a0" stroke-width="1.5"/>
<text x="640" y="500" font-size="18" font-weight="700" fill="#e6edf3">Bridge</text>
<text x="640" y="526" font-size="14" fill="#c9d1d9">correlates every node</text>
<text x="640" y="550" font-size="14" fill="#c9d1d9">stores detections</text>
<text x="640" y="574" font-size="14" fill="#c9d1d9">learned baselines</text>
<text x="640" y="598" font-size="14" fill="#c9d1d9">alert rules</text>
<line x1="942" y1="451" x2="996" y2="451" stroke="#9198a1" stroke-width="1.6" marker-end="url(#a)"/>

