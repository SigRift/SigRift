<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
<title id="t">SigRift: many radios, one dashboard</title>
<desc id="d">Three Raspberry Pi nodes with different radios (an RTL-SDR, a Wi-Fi adapter and Bluetooth) send detections and heartbeats over HTTPS, each with its own API key, to a central server. The gateway there handles TLS and authentication, and the bridge correlates all nodes, stores detections and runs alert rules. Operators see one dashboard with live stats, a detection-rate chart and alerts they can acknowledge or mark as known. Illustrative example.</desc>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#9198a1"/></marker>
  <linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3fb950" stop-opacity="0.45"/><stop offset="1" stop-color="#3fb950" stop-opacity="0.05"/></linearGradient>
</defs>
<rect width="1600" height="900" fill="#000000"/>

<!-- Title -->
<text x="48" y="78" font-size="36" font-weight="700" fill="#e6edf3">Many radios, one dashboard</text>
<text x="48" y="112" font-size="18" fill="#9198a1">SigRift nodes with different radios report to one central server.</text>

<!-- Node 1: RTL-SDR -->
<rect x="48" y="150" width="420" height="170" rx="14" fill="none" stroke="#6e7681" stroke-width="1.5" stroke-dasharray="7 6"/>
<text x="68" y="184" font-size="17" font-weight="600" fill="#9198a1">Node · rooftop</text>
<rect x="68" y="208" width="160" height="48" rx="10" fill="#0c2d4d" stroke="#58a6ff" stroke-width="1.5"/>
<text x="148" y="238" font-size="16" font-weight="600" text-anchor="middle" fill="#e6edf3">RTL-SDR</text>
<line x1="230" y1="232" x2="260" y2="232" stroke="#9198a1" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="264" y="196" width="184" height="72" rx="10" fill="#161b22" stroke="#6e7681" stroke-width="1.5"/>
<text x="356" y="226" font-size="16" font-weight="600" text-anchor="middle" fill="#e6edf3">Raspberry Pi</text>
<text x="356" y="250" font-size="13" text-anchor="middle" fill="#9198a1" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">scanner + agent</text>
<text x="68" y="298" font-size="14" fill="#9198a1">classifies RF from 24 MHz to 1.7 GHz</text>

<!-- Node 2: Wi-Fi -->
<rect x="48" y="350" width="420" height="170" rx="14" fill="none" stroke="#6e7681" stroke-width="1.5" stroke-dasharray="7 6"/>
<text x="68" y="384" font-size="17" font-weight="600" fill="#9198a1">Node · office</text>
<rect x="68" y="408" width="160" height="48" rx="10" fill="#0f2d27" stroke="#3fb9a0" stroke-width="1.5"/>
<text x="148" y="438" font-size="16" font-weight="600" text-anchor="middle" fill="#e6edf3">Wi-Fi adapter</text>
<line x1="230" y1="432" x2="260" y2="432" stroke="#9198a1" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="264" y="396" width="184" height="72" rx="10" fill="#161b22" stroke="#6e7681" stroke-width="1.5"/>
<text x="356" y="426" font-size="16" font-weight="600" text-anchor="middle" fill="#e6edf3">Raspberry Pi</text>
<text x="356" y="450" font-size="13" text-anchor="middle" fill="#9198a1" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">scanner + agent</text>
<text x="68" y="498" font-size="14" fill="#9198a1">networks, clients and deauth floods</text>

<!-- Node 3: Bluetooth -->
<rect x="48" y="550" width="420" height="170" rx="14" fill="none" stroke="#6e7681" stroke-width="1.5" stroke-dasharray="7 6"/>
<text x="68" y="584" font-size="17" font-weight="600" fill="#9198a1">Node · street</text>
<rect x="68" y="608" width="160" height="48" rx="10" fill="#3d1f0a" stroke="#f0883e" stroke-width="1.5"/>
<text x="148" y="638" font-size="16" font-weight="600" text-anchor="middle" fill="#e6edf3">Bluetooth</text>
<line x1="230" y1="632" x2="260" y2="632" stroke="#9198a1" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="264" y="596" width="184" height="72" rx="10" fill="#161b22" stroke="#6e7681" stroke-width="1.5"/>
